<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Gracefully ignore WebSocket/HMR errors in preview iframe as HMR is disabled in AI Studio
      window.addEventListener('unhandledrejection', function(event) {
        var msg = (event && event.reason && (event.reason.message || event.reason.stack || '')) + '';
        if (msg.includes('WebSocket') || msg.includes('vite:ws') || msg.includes('@vite/client')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && (event.message || '')) + '';
        var src = (event && (event.filename || '')) + '';
        if (msg.includes('WebSocket') || src.includes('@vite/client')) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      });
    </script>
    <title>PreserVenice - Preserving Venetian Monuments &amp; Public Art</title>
    <meta name="description" content="PreserVenice is a non-profit organization devoted to the preservation and restoration of public art in Venice, Italy." />
    <meta property="og:title" content="PreserVenice - Preserving Venetian Monuments &amp; Public Art" />
    <meta property="og:description" content="PreserVenice is a non-profit organization devoted to the preservation and restoration of public art in Venice, Italy." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#ffffff] text-[#111827] antialiased selection:bg-[#fee2e2] selection:text-[#b91c1c]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
